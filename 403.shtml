<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forbidden | Sk Md Ziad Rahman</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #14181F;
    --surface: #1C222B;
    --line: #2C3542;
    --ink: #E8E6DF;
    --ink-dim: #9BA3AF;
    --accent: #E8A33D;
    --sage: #7C9885;

    --display: 'Fraunces', serif;
    --body: 'Inter', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--accent); color:#14181F; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .wrap{ max-width:560px; text-align:center; }

  .code{
    font-family:var(--mono); font-size:14px; color:var(--sage);
    display:inline-flex; align-items:center; gap:8px; margin-bottom:24px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--sage); box-shadow:0 0 0 3px rgba(124,152,133,0.25); }

  h1{
    font-family:var(--display); font-weight:600; font-size:clamp(64px,14vw,120px);
    line-height:1; color:var(--accent); margin-bottom:8px;
  }
  h2{
    font-family:var(--display); font-weight:500; font-size:clamp(22px,4vw,30px);
    margin-bottom:16px;
  }
  p{ color:var(--ink-dim); margin-bottom:36px; }

  .terminal{
    font-family:var(--mono); font-size:14px; background:var(--surface);
    border:1px solid var(--line); border-radius:6px; padding:18px 20px;
    margin-bottom:36px; color:var(--ink-dim); text-align:left;
  }
  .terminal .prompt{ color:var(--accent); }
  .terminal .out{ color:var(--ink); }

  .ctas{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .btn{
    font-family:var(--mono); font-size:14px; padding:12px 22px; border-radius:4px;
    border:1px solid var(--accent); color:var(--accent); transition:.15s ease;
    display:inline-block;
  }
  .btn:hover{ background:var(--accent); color:#14181F; }
  .btn.ghost{ border-color:var(--line); color:var(--ink-dim); }
  .btn.ghost:hover{ border-color:var(--ink-dim); color:var(--ink); background:none; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="code"><span class="dot"></span> ERROR</div>
    <h1>403</h1>
    <h2>Not Allowed!</h2>

    <div class="ctas">
      <a class="btn" href="/">Back to Home</a>
    </div>
  </div>

</body>
</html>
